server {
 listen 8080;
 server_name _;
 server_tokens off;
 access_log off;
 root /usr/share/nginx/html;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
 location = / { try_files /index.html =404; }
 location /assets/ { try_files $uri =404; }
 resolver 127.0.0.11 valid=5s ipv6=off;
 location / { set $api_upstream "http://${API_UPSTREAM}"; proxy_pass $api_upstream; proxy_connect_timeout 1s; proxy_read_timeout 4s; }
}
