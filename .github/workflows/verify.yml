name: Verify
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check repository boundary
        run: python3 scripts/check_secrets.py --history
      - name: Run tests and build
        run: docker compose -p platform-verification -f compose.test.yaml run --build --rm checks
      - name: Reproduce from current revision
        run: python3 scripts/verify_release.py --ref HEAD --port 18772
